name: LCS · CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: lcs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Ruff + mypy (lcs_integrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: lcs_integrations
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff mypy
      - name: Ruff
        working-directory: lcs_integrations
        run: ruff check .
      - name: Mypy
        working-directory: lcs_integrations
        run: mypy lcs_integrations || true  # non-blocking until types are complete

  test-python:
    name: Pytest (lcs_integrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lcs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: lcs_integrations
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest (coverage gate 80%)
        working-directory: lcs_integrations
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/lcs_test
        run: pytest
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: lcs_integrations/.coverage*
          if-no-files-found: ignore

  build-frontend:
    name: Build Vue frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: yarn lint || true  # non-blocking until upstream lint config matches
      - name: Unit tests (vitest)
        working-directory: frontend
        run: yarn test --run --coverage || true
      - name: Build
        working-directory: frontend
        run: yarn build

  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install commitlint
        run: npm i -g @commitlint/cli @commitlint/config-conventional
      - name: Lint PR commits
        run: |
          echo "module.exports = {extends:['@commitlint/config-conventional']};" > commitlint.config.js
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }}
