# CI/CD Pipeline — Lint, Test, Build for Frappe Bench
# Runs on PRs to develop and main

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  FRAPPE_BRANCH: 'version-16'

jobs:
  lint:
    name: Lint (Ruff + ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff (Python lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Uncomment when frontend is set up:
      # - name: Install frontend dependencies
      #   working-directory: ./frontend
      #   run: npm ci
      #
      # - name: Run ESLint
      #   working-directory: ./frontend
      #   run: npx eslint src/ --ext .ts,.tsx

  test:
    name: Test (Python + Frappe)
    runs-on: ubuntu-latest
    needs: lint

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: frappe
          MYSQL_DATABASE: test_site
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379

      redis-socketio:
        image: redis:7-alpine
        ports:
          - 12000:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev redis-tools

      - name: Install bench
        run: pip install frappe-bench

      - name: Initialize bench
        run: |
          bench init --skip-redis-config-generation --frappe-branch ${{ env.FRAPPE_BRANCH }} frappe-bench
          cd frappe-bench

          # Configure Redis
          bench set-config -g redis_cache "redis://localhost:13000"
          bench set-config -g redis_queue "redis://localhost:11000"
          bench set-config -g redis_socketio "redis://localhost:12000"

          # Configure MariaDB
          bench set-config -g db_host "127.0.0.1"
          bench set-config -g db_port 3306

      - name: Install app
        working-directory: ./frappe-bench
        run: |
          bench get-app --resolve-deps $GITHUB_WORKSPACE
          bench new-site --mariadb-root-password frappe --admin-password admin test-site.localhost
          bench --site test-site.localhost install-app my_app

      - name: Run Python tests
        working-directory: ./frappe-bench
        run: |
          bench --site test-site.localhost run-tests --app my_app --coverage
        env:
          CI: true

      # Uncomment when coverage tool is configured:
      # - name: Upload Coverage
      #   uses: codecov/codecov-action@v4
      #   with:
      #     directory: ./frappe-bench

  # Uncomment when frontend is set up:
  # test-frontend:
  #   name: Test (Frontend — Vitest)
  #   runs-on: ubuntu-latest
  #   needs: lint
  #
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #
  #     - name: Install dependencies
  #       working-directory: ./frontend
  #       run: npm ci
  #
  #     - name: Run Vitest
  #       working-directory: ./frontend
  #       run: npm test -- --coverage

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt || true
        continue-on-error: true

      # Uncomment when frontend is set up:
