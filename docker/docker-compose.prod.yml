# LCS CRM · Production compose for a single cloud VM.
#
#   cp .env.prod.example .env   # fill in secrets first
#   docker compose -f docker/docker-compose.prod.yml up -d
#   docker compose -f docker/docker-compose.prod.yml run --rm create-site  # first boot only
#
# TLS: this stack listens on 127.0.0.1:8080 — put the VM's nginx/caddy or a
# cloud load balancer with the real certificate in front (see
# docs/operations/vm-deploy.md). No dev server anywhere.

name: lcs-crm

x-app: &app
  image: ${CRM_IMAGE:-lcs-crm:latest}
  restart: unless-stopped
  env_file: ../.env
  volumes:
    - sites:/home/frappe/frappe-bench/sites
  depends_on:
    db:
      condition: service_healthy
    redis-cache:
      condition: service_started
    redis-queue:
      condition: service_started

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -p${DB_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  configurator:
    <<: *app
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;

  create-site:
    <<: *app
    restart: "no"
    profiles: ["setup"]
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 db:3306;
        bench new-site "${SITE_NAME:?}"
        --mariadb-user-host-login-scope='%'
        --admin-password "${ADMIN_PASSWORD:?}"
        --db-root-password "${DB_ROOT_PASSWORD}"
        --install-app erpnext
        --install-app crm
        --install-app pilanda_theme
        --install-app pilanda_sales
        --install-app lcs_integrations
        --set-default;
        bench --site "${SITE_NAME}" set-config mute_emails 0;
        bench --site "${SITE_NAME}" execute lcs_integrations.msal_sso.provider.install_or_update || true

  backend:
    <<: *app

  frontend:
    <<: *app
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
      - websocket

  websocket:
    <<: *app
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  scheduler:
    <<: *app
    command: ["bench", "schedule"]

  queue-short:
    <<: *app
    command: ["bench", "worker", "--queue", "short,default"]

  queue-long:
    <<: *app
    command: ["bench", "worker", "--queue", "long,default,short"]

volumes:
  sites:
  db-data:
  redis-queue-data:
