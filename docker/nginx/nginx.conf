# Nginx reverse proxy for the LCS CRM (Azure Container Apps front door).
# TLS termination, HSTS, gzip, rate limiting on login + webhook endpoints.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;

    # Rate limit buckets.
    limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/s;
    limit_req_zone $binary_remote_addr zone=hook:10m   rate=30r/s;

    upstream frappe {
        server frappe:8000;
        keepalive 32;
    }

    upstream socketio {
        server frappe:9000;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        client_max_body_size 50m;

        location /api/method/login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://frappe;
            include /etc/nginx/proxy_params.conf;
        }

        location ~* ^/api/method/lcs\.(abas|proxess|outlook)\.webhook$ {
            limit_req zone=hook burst=50 nodelay;
            proxy_pass http://frappe;
            include /etc/nginx/proxy_params.conf;
        }

        location /socket.io/ {
            proxy_pass http://socketio;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            include /etc/nginx/proxy_params.conf;
        }

        # PWA offline scope: let the CRM service worker (physically at
        # /assets/crm/frontend/sw.js) control the /crm navigation scope so
        # deep links work offline. Without this header browsers reject the
        # broader register({scope:"/crm"}).
        location = /assets/crm/frontend/sw.js {
            add_header Service-Worker-Allowed /crm;
            proxy_pass http://frappe;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass http://frappe;
            include /etc/nginx/proxy_params.conf;
        }
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}
