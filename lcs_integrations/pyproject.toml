[project]
name = "lcs_integrations"
version = "0.1.0"
description = "LCS-specific integrations for the Frappe CRM (abas ERP, Proxess DMS, Outlook/MS Graph, MSAL SSO, lead scoring)."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "LCS Group IT" }]
dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27,<0.29",
    "msal>=1.28,<2",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "respx>=0.21,<0.22",
    "freezegun>=1.5,<2",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
# LCS bench runs Frappe 17-dev — accept any 15+ version, no upper cap.
frappe = ">=15.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "PL"]
ignore = ["E501", "PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["tests/fixtures", "**/patches/**"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --cov=lcs_integrations --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
testpaths = ["tests"]
markers = [
    "integration: Requires a live Frappe test site.",
    "contract: Pact-style contract tests against vendor APIs.",
]
