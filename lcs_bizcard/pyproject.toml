[project]
name = "lcs_bizcard"
version = "0.1.0"
description = "Standalone Frappe app: business-card scanner powered by a local Tesseract microservice. Embedded into Frappe CRM via iframe."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "LCS Group IT" }]
dependencies = [
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "lcs_bizcard"
